<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="siteTitle">Catálogo Online</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 20px; overflow-x: hidden; }
    body.modal-open { overflow: hidden; }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .brand h1 { font-size: 1.2rem; }

    .btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .search-container { padding: 15px 15px 5px; }
    .search-input {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .catalog {
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    @media (min-width: 600px) { .catalog { grid-template-columns: repeat(2, 1fr); } }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 60vw;
      max-height: 300px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .carousel img.active { display: block; }

    .product-info { padding: 15px; flex-grow: 1; }
    .product-info h3 { font-size: 1.1rem; margin-bottom: 5px; }
    .product-info p { color: #64748b; font-size: 0.9rem; }

    .admin-panel { padding: 15px; display: none; }
    .admin-card { background: white; padding: 20px; border-radius: 12px; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
    }
    #loginModal { align-items: flex-end; }
    #loginModal .modal-content {
      background: white;
      padding: 20px;
      border-radius: 20px 20px 0 0;
      width: 100%;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
    }

    .image-upload-wrapper {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
    }
    
    #imagePreviewContainer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .preview-image-item { position: relative; padding-top: 100%; background: #e2e8f0; border-radius: 8px; overflow: hidden; }
    .preview-image-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    .btn-block { width: 100%; padding: 15px; border: none; margin-bottom: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-primary { background: var(--primary-color); color: white; }
    
    #loadingSpinner { text-align: center; padding: 20px; display: none; font-weight: bold; color: var(--primary-color); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Catálogo Online</h1>
    </div>
    <button class="btn" id="loginBtn" onclick="openLoginModal()">Admin</button>
  </header>

  <!-- Painel Admin -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 id="adminWelcomeTitle">Painel</h2>
        <button type="button" class="btn btn-danger" style="padding: 8px 12px;" onclick="logout()">Sair</button>
      </div>

      <div id="sectionProduct">
        <form id="productForm">
          <div class="form-group">
            <label>Nome do Produto</label>
            <input type="text" id="prodName" required placeholder="Ex: Bolo de Pote">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="prodDesc" rows="3" required placeholder="Ex: Sabor brigadeiro"></textarea>
          </div>
          
          <div class="form-group">
            <label>Fotos em Alta Resolução (Drive)</label>
            <input type="file" id="prodImagesInput" accept="image/*" multiple style="display:none;" onchange="handleProductImagesInput(this)">
            <div class="image-upload-wrapper" onclick="document.getElementById('prodImagesInput').click()">
              <span style="font-size:2rem;">📷</span>
              <p>Toque para adicionar fotos</p>
            </div>
            <div id="imagePreviewContainer"></div>
          </div>
          
          <button type="submit" class="btn btn-success btn-block" id="submitBtn">Enviar para Nuvem (Google Drive)</button>
        </form>
      </div>
    </div>
  </div>

  <div class="search-container">
    <input type="search" class="search-input" id="searchInput" placeholder="🔍 Pesquisar produtos..." oninput="filterProducts()">
  </div>

  <div id="loadingSpinner">⏳ Carregando produtos do Google Sheets...</div>

  <main class="catalog" id="catalog"></main>

  <!-- Modal Login -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2 style="margin-bottom: 15px; text-align:center;">Acesso Restrito</h2>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="adminPassword" placeholder="Digite sua senha">
      </div>
      <div style="display: flex; gap: 10px;">
        <button type="button" class="btn btn-block" style="background: #cbd5e1; color:#1e293b;" onclick="closeLoginModal()">Cancelar</button>
        <button type="button" class="btn btn-block btn-primary" onclick="login()">Entrar</button>
      </div>
    </div>
  </div>

  <script>
    // Cole aqui a URL gerada no final da Etapa 3 do Google Apps Script
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwuiZkfhe9vqV9-7upyfR0FS0PUXdSm4bia6L3kIriI7WvhFSV7_niPX8pmpNyRw2E3RQ/exec";

    const PASS_TOTAL = "2312jkma";
    const PASS_PRODUCTS = "admin123";
    let userRole = null;
    let tempProductImages = []; 
    let products = [];

    function init() {
      fetchProductsFromGoogle();
    }

    // Busca os produtos direto da Planilha do Google
    function fetchProductsFromGoogle() {
      document.getElementById('loadingSpinner').style.display = 'block';
      fetch(GOOGLE_API_URL)
        .then(res => res.json())
        .then(data => {
          products = data;
          renderProducts(products);
          document.getElementById('loadingSpinner').style.display = 'none';
        })
        .catch(err => {
          console.error("Erro ao carregar dados:", err);
          document.getElementById('loadingSpinner').innerText = "Erro ao carregar dados do Google.";
        });
    }

    function renderProducts(items) {
      const catalog = document.getElementById('catalog');
      catalog.innerHTML = "";

      if(!items || items.length === 0) {
        catalog.innerHTML = `<div style='grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;'>Nenhum produto cadastrado.</div>`;
        return;
      }

      items.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const imgsToRender = (prod.images && prod.images.length > 0) ? prod.images : ['https://via.placeholder.com/300'];

        let imagesHTML = imgsToRender.map((img, index) => 
          `<img src="${img}" class="${index === 0 ? 'active' : ''}">`
        ).join('');

        card.innerHTML = `
          <div class="carousel">${imagesHTML}</div>
          <div class="product-info">
            <h3>${prod.name}</h3>
            <p>${prod.desc}</p>
          </div>
        `;
        catalog.appendChild(card);
      });
    }

    // Processa o envio do formulário e salva no Google
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Enviando fotos para o Drive... Aguarde.";
      btn.disabled = true;

      const payload = {
        name: document.getElementById('prodName').value,
        desc: document.getElementById('prodDesc').value,
        images: tempProductImages
      };

      fetch(GOOGLE_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert("Produto e fotos em alta qualidade salvos com sucesso no Google!");
        this.reset();
        tempProductImages = [];
        document.getElementById('imagePreviewContainer').innerHTML = '';
        btn.innerText = "Enviar para Nuvem (Google Drive)";
        btn.disabled = false;
        fetchProductsFromGoogle(); 
      })
      .catch(err => {
        alert("Erro ao enviar para o Google. Verifique a URL da API.");
        btn.innerText = "Enviar para Nuvem (Google Drive)";
        btn.disabled = false;
      });
    });

    async function handleProductImagesInput(input) {
      if (input.files) {
        for (const file of Array.from(input.files)) {
          const base64 = await readFileAsBase64(file);
          tempProductImages.push(base64);
        }
        renderPreviews();
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = '';
      tempProductImages.forEach((img) => {
        const div = document.createElement('div');
        div.className = 'preview-image-item';
        div.innerHTML = `<img src="${img}">`;
        container.appendChild(div);
      });
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    function login() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === PASS_TOTAL || pass === PASS_PRODUCTS) {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('loginBtn').style.display = 'none';
        closeLoginModal();
      } else {
        alert("Senha incorreta!");
      }
    }

    function logout() {
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginBtn').style.display = 'block';
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    init();
  </script>
</body>
</html>

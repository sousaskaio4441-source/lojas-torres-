<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="siteTitle">Catálogo Online</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 20px; overflow-x: hidden; transition: background-color 0.3s; }
    body.modal-open { overflow: hidden; }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { max-height: 35px; max-width: 100px; border-radius: 4px; display: none; object-fit: contain; }
    .brand h1 { font-size: 1.2rem; }

    .btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .search-container { padding: 15px 15px 5px; }
    .search-input {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .catalog {
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    @media (min-width: 600px) { .catalog { grid-template-columns: repeat(2, 1fr); } }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 60vw;
      max-height: 300px;
      background: #e2e8f0;
      overflow: hidden;
      cursor: pointer;
    }
    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .carousel img.active { display: block; }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10;
    }
    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .product-info { padding: 15px; flex-grow: 1; }
    .product-info h3 { font-size: 1.1rem; margin-bottom: 5px; }
    .product-info p { color: #64748b; font-size: 0.9rem; }

    .admin-panel { padding: 15px; display: none; }
    .admin-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
    }
    #loginModal { align-items: flex-end; }
    #loginModal .modal-content {
      background: white;
      padding: 20px;
      border-radius: 20px 20px 0 0;
      width: 100%;
    }

    /* Modal Zoom Carrossel */
    #zoomModal {
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #zoomModal img {
      max-width: 90%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .zoom-controls {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .zoom-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #closeZoom {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.3);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
    }

    .image-upload-wrapper {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
    }
    
    #imagePreviewContainer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .preview-image-item { position: relative; padding-top: 100%; background: #e2e8f0; border-radius: 8px; overflow: hidden; }
    .preview-image-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    .btn-block { width: 100%; padding: 15px; border: none; margin-bottom: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-primary { background: var(--primary-color); color: white; }
    
    #loadingSpinner { text-align: center; padding: 20px; display: none; font-weight: bold; color: var(--primary-color); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img id="logoImg" src="" alt="Logo">
      <h1 id="headerTitle">Catálogo Online</h1>
    </div>
    <button class="btn" id="loginBtn" onclick="openLoginModal()">Admin</button>
  </header>

  <!-- Painel Admin -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 id="adminWelcomeTitle">Painel</h2>
        <button type="button" class="btn btn-danger" style="padding: 8px 12px;" onclick="logout()">Sair</button>
      </div>

      <!-- Seção Exclusiva para Senha de Acesso Total (2312jkma) -->
      <div id="customizationSection" style="display: none; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 15px;">
        <h3>🎨 Personalizar Aparência</h3>
        <br>
        <div class="form-group">
          <label>Nome do Site</label>
          <input type="text" id="customTitleInput" placeholder="Ex: Minha Loja">
        </div>
        <div class="form-group">
          <label>Cor Principal (Cabeçalho/Botões)</label>
          <input type="color" id="primaryColorInput" style="height: 45px;">
        </div>
        <div class="form-group">
          <label>Cor de Fundo do Site</label>
          <input type="color" id="bgColorInput" style="height: 45px;">
        </div>
        <div class="form-group">
          <label>Logo do Site</label>
          <input type="file" id="logoFileInput" accept="image/*" style="display:none;" onchange="handleLogoSelect(this)">
          <button type="button" class="btn btn-primary btn-block" style="background:#64748b;" onclick="document.getElementById('logoFileInput').click()">📷 Selecionar Logo</button>
        </div>
        <button type="button" class="btn btn-primary btn-block" onclick="saveCustomizations()">Salvar Alterações Visuais</button>
      </div>

      <!-- Seção de Cadastro de Produtos -->
      <div id="sectionProduct">
        <h3>➕ Cadastrar Produto</h3>
        <br>
        <form id="productForm">
          <div class="form-group">
            <label>Nome do Produto</label>
            <input type="text" id="prodName" required placeholder="Ex: Bolo de Pote">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="prodDesc" rows="3" required placeholder="Ex: Sabor brigadeiro"></textarea>
          </div>
          
          <div class="form-group">
            <label>Fotos em Alta Resolução (Drive)</label>
            <input type="file" id="prodImagesInput" accept="image/*" multiple style="display:none;" onchange="handleProductImagesInput(this)">
            <div class="image-upload-wrapper" onclick="document.getElementById('prodImagesInput').click()">
              <span style="font-size:2rem;">📷</span>
              <p>Toque para adicionar fotos</p>
            </div>
            <div id="imagePreviewContainer"></div>
          </div>
          
          <button type="submit" class="btn btn-success btn-block" id="submitBtn">Enviar para Nuvem (Google Drive)</button>
        </form>
      </div>
    </div>
  </div>

  <div class="search-container">
    <input type="search" class="search-input" id="searchInput" placeholder="🔍 Pesquisar produtos..." oninput="filterProducts()">
  </div>

  <div id="loadingSpinner">⏳ Carregando produtos do Google Sheets...</div>

  <main class="catalog" id="catalog"></main>

  <!-- Modal Login -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2 style="margin-bottom: 15px; text-align:center;">Acesso Restrito</h2>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="adminPassword" placeholder="Digite sua senha">
      </div>
      <div style="display: flex; gap: 10px;">
        <button type="button" class="btn btn-block" style="background: #cbd5e1; color:#1e293b;" onclick="closeLoginModal()">Cancelar</button>
        <button type="button" class="btn btn-block btn-primary" onclick="login()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Zoom com Carrossel -->
  <div class="modal" id="zoomModal">
    <button type="button" id="closeZoom" onclick="closeZoomModal()">×</button>
    <img id="zoomedImage" src="" alt="Imagem Ampliada">
    <div class="zoom-controls" id="zoomControls">
      <button type="button" class="zoom-btn" onclick="prevZoomImage()">❮ Anterior</button>
      <button type="button" class="zoom-btn" onclick="nextZoomImage()">Próximo ❯</button>
    </div>
  </div>

  <script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwuiZkfhe9vqV9-7upyfR0FS0PUXdSm4bia6L3kIriI7WvhFSV7_niPX8pmpNyRw2E3RQ/exec";

    const PASS_TOTAL = "2312jkma";
    const PASS_PRODUCTS = "admin123";
    let userRole = null;
    let tempProductImages = []; 
    let products = [];
    
    // Variáveis do Zoom
    let currentZoomImages = [];
    let currentZoomIndex = 0;

    let settings = JSON.parse(localStorage.getItem('site_settings')) || {
      title: "Catálogo Online",
      primaryColor: "#2563eb",
      bgColor: "#f1f5f9",
      logo: ""
    };

    function init() {
      applySettings();
      fetchProductsFromGoogle();
    }

    function applySettings() {
      document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
      document.documentElement.style.setProperty('--bg-color', settings.bgColor);
      document.getElementById('headerTitle').innerText = settings.title;
      document.getElementById('siteTitle').innerText = settings.title;
      
      const logoImg = document.getElementById('logoImg');
      if (settings.logo) {
        logoImg.src = settings.logo;
        logoImg.style.display = 'block';
      } else {
        logoImg.style.display = 'none';
      }

      document.getElementById('customTitleInput').value = settings.title;
      document.getElementById('primaryColorInput').value = settings.primaryColor;
      document.getElementById('bgColorInput').value = settings.bgColor;
    }

    function handleLogoSelect(input) {
      if (input.files && input.files[0]) {
        readFileAsBase64(input.files[0]).then(base64 => {
          settings.logo = base64;
          alert("Logo selecionada! Clique em 'Salvar Alterações Visuais' para aplicar.");
        });
      }
    }

    function saveCustomizations() {
      if (userRole !== PASS_TOTAL) return;
      settings.title = document.getElementById('customTitleInput').value || "Catálogo Online";
      settings.primaryColor = document.getElementById('primaryColorInput').value;
      settings.bgColor = document.getElementById('bgColorInput').value;
      
      localStorage.setItem('site_settings', JSON.stringify(settings));
      applySettings();
      alert("Aparência do site atualizada com sucesso!");
    }

    function fetchProductsFromGoogle() {
      document.getElementById('loadingSpinner').style.display = 'block';
      fetch(GOOGLE_API_URL)
        .then(res => res.json())
        .then(data => {
          products = data;
          renderProducts(products);
          document.getElementById('loadingSpinner').style.display = 'none';
        })
        .catch(err => {
          console.error("Erro ao carregar dados:", err);
          document.getElementById('loadingSpinner').innerText = "Erro ao carregar dados do Google.";
        });
    }

    function renderProducts(items) {
      const catalog = document.getElementById('catalog');
      catalog.innerHTML = "";

      if(!items || items.length === 0) {
        catalog.innerHTML = `<div style='grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;'>Nenhum produto cadastrado.</div>`;
        return;
      }

      items.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const imgsToRender = (prod.images && prod.images.length > 0) ? prod.images : ['https://via.placeholder.com/300'];

        let imagesHTML = imgsToRender.map((img, index) => 
          `<img src="${img}" class="${index === 0 ? 'active' : ''}">`
        ).join('');

        let carouselControls = imgsToRender.length > 1 ? `
          <button type="button" class="carousel-btn prev" onclick="moveCarousel(event, this, -1)">❮</button>
          <button type="button" class="carousel-btn next" onclick="moveCarousel(event, this, 1)">❯</button>
        ` : '';

        let deleteBtnHTML = userRole !== null ? `
          <button type="button" class="btn btn-danger btn-block" style="margin-top:10px;" onclick="deleteProduct('${prod.id}')">🗑️ Excluir Produto</button>
        ` : '';

        card.innerHTML = `
          <div class="carousel" onclick="openZoomModal(${JSON.stringify(imgsToRender).replace(/"/g, '&quot;')})">
            ${imagesHTML}
            ${carouselControls}
          </div>
          <div class="product-info">
            <h3>${prod.name}</h3>
            <p>${prod.desc}</p>
            ${deleteBtnHTML}
          </div>
        `;
        catalog.appendChild(card);
      });
    }

    function moveCarousel(event, btn, direction) {
      event.stopPropagation();
      const carousel = btn.parentElement;
      const images = carousel.querySelectorAll('img');
      let activeIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
      
      images[activeIndex].classList.remove('active');
      let newIndex = (activeIndex + direction + images.length) % images.length;
      images[newIndex].classList.add('active');
    }

    // Modal Zoom
    function openZoomModal(imgs) {
      currentZoomImages = imgs;
      currentZoomIndex = 0;
      updateZoomImage();
      document.getElementById('zoomControls').style.display = imgs.length > 1 ? 'flex' : 'none';
      document.getElementById('zoomModal').style.display = 'flex';
      document.body.classList.add('modal-open');
    }

    function updateZoomImage() {
      document.getElementById('zoomedImage').src = currentZoomImages[currentZoomIndex];
    }

    function prevZoomImage() {
      currentZoomIndex = (currentZoomIndex - 1 + currentZoomImages.length) % currentZoomImages.length;
      updateZoomImage();
    }

    function nextZoomImage() {
      currentZoomIndex = (currentZoomIndex + 1) % currentZoomImages.length;
      updateZoomImage();
    }

    function closeZoomModal() {
      document.getElementById('zoomModal').style.display = 'none';
      document.body.classList.remove('modal-open');
    }

    // Exclusão de Produto
    function deleteProduct(id) {
      if (!confirm("Tem certeza de que deseja excluir este produto?")) return;

      document.getElementById('loadingSpinner').style.display = 'block';
      document.getElementById('loadingSpinner').innerText = "Excluindo produto...";

      fetch(GOOGLE_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "delete", id: id })
      })
      .then(res => res.json())
      .then(res => {
        alert("Produto excluído com sucesso!");
        fetchProductsFromGoogle();
      })
      .catch(err => {
        alert("Erro ao excluir produto.");
        document.getElementById('loadingSpinner').style.display = 'none';
      });
    }

    // Formulário de Cadastro
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Enviando fotos para o Drive... Aguarde.";
      btn.disabled = true;

      const payload = {
        action: "create",
        name: document.getElementById('prodName').value,
        desc: document.getElementById('prodDesc').value,
        images: tempProductImages
      };

      fetch(GOOGLE_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert("Produto e fotos em alta qualidade salvos com sucesso no Google!");
        this.reset();
        tempProductImages = [];
        document.getElementById('imagePreviewContainer').innerHTML = '';
        btn.innerText = "Enviar para Nuvem (Google Drive)";
        btn.disabled = false;
        fetchProductsFromGoogle(); 
      })
      .catch(err => {
        alert("Erro ao enviar para o Google. Verifique a URL da API.");
        btn.innerText = "Enviar para Nuvem (Google Drive)";
        btn.disabled = false;
      });
    });

    async function handleProductImagesInput(input) {
      if (input.files) {
        for (const file of Array.from(input.files)) {
          const base64 = await readFileAsBase64(file);
          tempProductImages.push(base64);
        }
        renderPreviews();
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = '';
      tempProductImages.forEach((img) => {
        const div = document.createElement('div');
        div.className = 'preview-image-item';
        div.innerHTML = `<img src="${img}">`;
        container.appendChild(div);
      });
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    function login() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === PASS_TOTAL) {
        userRole = PASS_TOTAL;
        document.getElementById('adminWelcomeTitle').innerText = "Painel (Acesso Total)";
        document.getElementById('customizationSection').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('loginBtn').style.display = 'none';
        closeLoginModal();
        renderProducts(products);
      } else if (pass === PASS_PRODUCTS) {
        userRole = PASS_PRODUCTS;
        document.getElementById('adminWelcomeTitle').innerText = "Painel (Apenas Produtos)";
        document.getElementById('customizationSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('loginBtn').style.display = 'none';
        closeLoginModal();
        renderProducts(products);
      } else {
        alert("Senha incorreta!");
      }
    }

    function logout() {
      userRole = null;
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginBtn').style.display = 'block';
      renderProducts(products);
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    init();
  </script>
</body>
</html>
